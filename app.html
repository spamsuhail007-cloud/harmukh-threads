<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmukh Threads – Premium Kashmir Handicrafts</title>
<meta name="description" content="Handwoven Kashmir handicrafts — rugs, pashmina, woodcraft. Authentic artisan-made pieces from the Himalayas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- STICKY NAVBAR -->
<header id="navbar" class="navbar" role="banner">
  <div class="navbar-inner">
    <a href="#" id="logo-link" class="navbar-logo" aria-label="Harmukh Threads Home">
      <span class="logo-mark">✦</span>
      <span class="logo-text">Harmukh Threads</span>
    </a>
    <nav class="navbar-nav desktop-nav" id="main-nav" aria-label="Primary navigation">
      <a href="#" class="nav-link" data-page="home">Collections</a>
      <a href="#" class="nav-link" data-page="rugs">Rugs</a>
      <a href="#" class="nav-link" data-page="artisan">Our Story</a>
      <a href="#" class="nav-link">Journal</a>
      <a href="#" class="nav-link" data-page="returns">Policy</a>
    </nav>
    <div class="navbar-actions">
      <button class="icon-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="icon-btn cart-trigger" id="cart-btn" aria-label="Open cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-badge" id="cart-count" aria-label="0 items">0</span>
      </button>
      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <!-- Mobile nav -->
  <nav class="mobile-nav" id="mobile-nav" aria-hidden="true">
    <a href="#" class="nav-link" data-page="home">Collections</a>
    <a href="#" class="nav-link" data-page="rugs">Rugs</a>
    <a href="#" class="nav-link" data-page="artisan">Our Story</a>
    <a href="#" class="nav-link">Journal</a>
    <a href="#" class="nav-link" data-page="returns">Policy</a>
    <a href="#" class="nav-link" data-page="admin">Admin</a>
  </nav>
</header>

<!-- PAGE CONTAINER -->
<main id="page-root" aria-live="polite">
  <!-- Pages injected here -->
</main>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cart-overlay" aria-hidden="true"></div>
<aside class="cart-drawer" id="cart-drawer" role="complementary" aria-label="Shopping cart" aria-hidden="true">
  <div class="cart-drawer-header">
    <h2 class="cart-title">Your Bag</h2>
    <button class="icon-btn cart-close" id="cart-close" aria-label="Close cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="cart-items" id="cart-items">
    <div class="cart-empty" id="cart-empty">
      <div class="cart-empty-icon">✦</div>
      <p>Your bag is empty.</p>
      <p class="cart-empty-sub">Add a piece from our collection.</p>
    </div>
  </div>
  <div class="cart-footer" id="cart-footer" style="display:none;">
    <div class="cart-total-row">
      <span class="cart-total-label">Subtotal</span>
      <span class="cart-total-amount" id="cart-total">₹0</span>
    </div>
    <p class="cart-shipping-note">Shipping &amp; duties calculated at checkout.</p>
    <button class="btn btn-primary btn-full" id="checkout-btn">Proceed to Checkout</button>
    <button class="btn btn-ghost btn-full" id="continue-shopping">Continue Shopping</button>
  </div>
</aside>

<script src="js/data.js"></script>
<script src="js/router.js"></script>
<script src="js/cart.js"></script>
<script src="js/pages/home-desktop.js"></script>
<script src="js/pages/home-mobile.js"></script>
<script src="js/pages/rugs.js"></script>
<script src="js/pages/product.js"></script>
<script src="js/pages/checkout.js"></script>
<script src="js/pages/artisan.js"></script>
<script src="js/pages/success.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/pages/returns.js"></script>
<script src="js/app.js"></script>
</body>
</html>
